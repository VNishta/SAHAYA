ag:"Unlike Fraction Addition",isFundamental:!1},{text:"A gardener waters 2/5 of a field in the morning and 3/10 in the evening. What fraction of the field is watered?",options:["5/15","7/10","5/10","6/50"],correctOptionIndex:1,conceptTag:"Unlike Fraction Addition",isFundamental:!1}]},"Equivalent Fractions":{analogy:"Cutting a roti into 2 equal pieces and eating 1 piece gives the exact same amount of food as cutting the same roti into 4 equal pieces and eating 2 pieces (1/2 = 2/4). The number of pieces changes, but the portion stays equal.",commonMisconception:"Students often add the same number to numerator and denominator (thinking 3/4 = 5/6 by adding 2 to both) instead of multiplying or dividing by a common factor.",workedExample:{problem:"Find an equivalent fraction for 3/4 with denominator 12",steps:["Step 1: Look at how the denominator changed: from 4 to 12.",'Step 2: Ask: "4 multiplied by what number gives 12?" -> 4 × 3 = 12.',"Step 3: Multiply the numerator by the exact same number (3): 3 × 3 = 9.","Step 4: The equivalent fraction is 9/12."]},activities:{relearn:"Chalkboard Number Line Overlay: Draw two parallel 0-to-1 number lines on the board—one marked in fourths, one in twelfths. Have students trace vertical lines showing where marks line up exactly.",practise:"Missing Number Dominoes: Provide 8 equivalent fraction equations with a blank box (e.g., 2/5 = [ ]/15) for students to solve and verify using multiplication tables.",advance:"Odd-One-Out Justification: Present sets of four fractions (e.g., 6/9, 10/15, 8/12, 9/12) and ask students to identify which one is not equivalent and prove why."},followUpQuestions:[{text:"Which number should replace the question mark to make the fractions equivalent: 2/5 = ?/20",options:["4","8","15","10"],correctOptionIndex:1,conceptTag:"Equivalent Fractions",isFundamental:!0},{text:"What is the simplest form of the fraction 12/18?",options:["6/9","2/3","3/4","4/6"],correctOptionIndex:1,conceptTag:"Equivalent Fractions",isFundamental:!0},{text:"Which pair of fractions below are equivalent?",options:["2/3 and 3/4","4/6 and 6/9","1/2 and 2/3","3/5 and 5/8"],correctOptionIndex:1,conceptTag:"Equivalent Fractions",isFundamental:!1}]},"Fraction-Decimal Conversion":{analogy:"Decimals are simply special fractions whose denominators are powers of 10 (10, 100, 1000)—just like paise and rupees where 50 paise is 50/100 of a rupee, written as 0.50.",commonMisconception:"Students often write the numerator and denominator directly after the decimal point (writing 3/5 as 0.35 or 1/4 as 0.14) instead of converting to tenths or hundredths first.",workedExample:{problem:"Convert 3/5 into a decimal",steps:["Step 1: Check if the denominator (5) can easily be turned into 10 or 100.","Step 2: Multiply numerator and denominator by 2 so the denominator becomes 10: (3 × 2)/(5 × 2) = 6/10.",'Step 3: Read 6/10 in place value terms: "six tenths".',"Step 4: Write six tenths in decimal form: 0.6."]},activities:{relearn:"10x10 Grid Shading: Use a 100-square grid on chart paper. Ask students to shade 1/4 of the grid (25 squares) and count the tenths and hundredths to see why 1/4 = 0.25 and not 0.14.",practise:"Benchmark Conversion Sprint: Practice converting denominator families of 2, 4, 5, 20, and 25 into tenths or hundredths and then into decimals.",advance:"Mixed Unit Word Problems: Combine distances or weights given partly in decimals (1.75 kg) and partly in fractions (3/4 kg) and solve both ways."},followUpQuestions:[{text:"When converting 4/5 to a decimal by first making the denominator 10, what fraction do we get?",options:["4/10","8/10","5/10","45/10"],correctOptionIndex:1,conceptTag:"Fraction-Decimal Conversion",isFundamental:!0},{text:"Which decimal is equivalent to 1/4?",options:["0.14","0.25","0.4","0.41"],correctOptionIndex:1,conceptTag:"Fraction-Decimal Conversion",isFundamental:!0},{text:"A bottle holds 1.5 litres of water. If 1/4 litre is poured out, how much water remains?",options:["1.10 L","1.25 L","1.00 L","1.40 L"],correctOptionIndex:1,conceptTag:"Fraction-Decimal Conversion",isFundamental:!1}]},"Pressure & Surface Area":{analogy:"Think of walking on soft sand in flat sports shoes versus pointed heels. Your body weight (Force) is the same, but when that force is spread over a larger sole area, the pressure is lower so you do not sink.",commonMisconception:"Students frequently confuse Force and Pressure, or multiply Force × Area instead of dividing Force / Area.",workedExample:{problem:"A box weighing 60 N rests on a table with a contact area of 3 m². Find the pressure.",steps:["Step 1: Recall the relationship: Pressure = Force ÷ Area.","Step 2: Identify Force = 60 N and Area = 3 m².","Step 3: Divide 60 by 3: 60 ÷ 3 = 20.","Step 4: Write the unit of pressure (N/m² or Pascals): 20 Pa."]},activities:{relearn:"Pencil & Palm Classroom Demo: Have students gently press a blunt pencil between their two palms—one palm touches the flat eraser end (large area) and the other touches the tip (small area). Notice the force is identical, yet the smaller area feels much higher pressure.",practise:"Formula Triangle Practice: Solve 5 numerical problems finding Pressure when Force and Area are given, keeping units in N and m².",advance:"Brick Orientation Problem: A rectangular brick measures 20 cm × 10 cm × 5 cm. Determine which face placed on the table exerts the maximum and minimum pressure."},followUpQuestions:[{text:"If the force applied stays constant and the surface area is doubled, what happens to the pressure?",options:["Pressure doubles","Pressure becomes half","Pressure stays the same","Pressure becomes zero"],correctOptionIndex:1,conceptTag:"Pressure & Surface Area",isFundamental:!0},{text:"A force of 80 N acts on an area of 4 m². What is the pressure produced?",options:["320 Pa","20 Pa","84 Pa","0.05 Pa"],correctOptionIndex:1,conceptTag:"Pressure & Surface Area",isFundamental:!1},{text:"Why do cutting tools like knives have sharp (thin) edges?",options:["To increas
